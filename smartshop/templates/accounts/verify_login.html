{% extends "base.html" %}
{% load i18n %}
{% block guest_content %}
<div class="guest-wrap"><div class="guest-card shadow">
  <h4 class="mb-1"><i class="bi bi-shield-lock text-primary"></i> {% trans "Login verification" %}</h4>
  <p class="text-muted">{% blocktrans %}Enter the code sent to{% endblocktrans %} <strong>{{ email }}</strong></p>
  <form method="post">{% csrf_token %}{{ form.code }}
    <button class="btn btn-primary w-100 mt-3" type="submit">{% trans "Verify & Login" %}</button></form>
  <a class="d-block text-center mt-3" href="{% url 'accounts:resend_otp' purpose='login' %}">{% trans "Resend code" %}</a>
</div></div>
{% endblock %}
