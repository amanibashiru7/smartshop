{% extends "base.html" %}
{% load i18n %}
{% block guest_content %}
<div class="guest-wrap"><div class="guest-card shadow">
  <h4 class="mb-1"><i class="bi bi-envelope-check text-primary"></i> {% trans "Verify your email" %}</h4>
  <p class="text-muted">{% blocktrans %}We sent a 6-digit code to{% endblocktrans %} <strong>{{ email }}</strong></p>
  <form method="post">{% csrf_token %}<label class="form-label">{% trans "Verification code" %}</label>{{ form.code }}
    <button class="btn btn-primary w-100 mt-3" type="submit">{% trans "Verify" %}</button></form>
  <a class="d-block text-center mt-3" href="{% url 'accounts:resend_otp' purpose='email_verify' %}">{% trans "Resend code" %}</a>
</div></div>
{% endblock %}
