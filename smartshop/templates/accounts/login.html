{% extends "base.html" %}
{% load i18n %}
{% block guest_content %}
<div class="guest-wrap">
  <div class="guest-card shadow">
    <h3 class="mb-1"><i class="bi bi-shop text-primary"></i> SMARTSHOP</h3>
    <p class="text-muted mb-4">{% trans "Login to your account" %}</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3"><label class="form-label">{% trans "Email" %}</label>{{ form.email }}</div>
      <div class="mb-3"><label class="form-label">{% trans "Password" %}</label>{{ form.password }}</div>
      <button class="btn btn-primary w-100" type="submit">{% trans "Login" %}</button>
    </form>
    <p class="text-center mt-3 mb-2">{% trans "No account?" %} <a href="{% url 'accounts:register' %}">{% trans "Register your shop" %}</a></p>

    <!-- Hapa ndipo tumeiweka ndani ya card nyeupe upande wa kulia -->
    <div style="text-align: right; border-top: 1px solid #eee; padding-top: 8px; margin-top: 10px;">
      <small style="color: #6c757d; font-style: italic;">built by eng.amani</small>
    </div>

  </div>
</div>
{% endblock %}
