{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h3 class="mb-4">{% trans "Record Purchase from" %} {{ supplier.name }}</h3>
<div class="card p-4">
<form method="post" id="purchaseForm">{% csrf_token %}
  <div id="purchaseItems"></div>
  <button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="addRow()"><i class="bi bi-plus"></i> {% trans "Add Item" %}</button>
  <br>
  <button class="btn btn-primary" type="submit">{% trans "Save Purchase" %}</button>
</form>
</div>
<template id="rowTemplate">
  <div class="row g-2 mb-2 align-items-center purchase-row">
    <div class="col-5">
      <select name="product_id" class="form-select" required>
        <option value="">{% trans "Select product" %}</option>
        {% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-3"><input type="number" name="quantity" class="form-control" placeholder="{% trans 'Qty' %}" min="1" required></div>
    <div class="col-3"><input type="number" step="0.01" name="unit_cost" class="form-control" placeholder="{% trans 'Unit cost' %}" required></div>
    <div class="col-1"><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.purchase-row').remove()"><i class="bi bi-trash"></i></button></div>
  </div>
</template>
{% endblock %}
{% block extra_js %}
<script>
function addRow() {
  const tpl = document.getElementById('rowTemplate').content.cloneNode(true);
  document.getElementById('purchaseItems').appendChild(tpl);
}
addRow();
</script>
{% endblock %}
